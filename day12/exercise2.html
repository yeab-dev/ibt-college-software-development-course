<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethiopian Airlines Flight Schedule</title>
</head>
<body>
    <h1>Ethiopian Airlines Flight Schedule</h1>

    <table>
        <caption>Flight Schedule</caption>

        <thead>
            <tr>
                <th scope="col">Flight</th>
                <th scope="col">From</th>
                <th scope="col">To</th>
                <th scope="col">Departs</th>
                <th scope="col">Price (ETB)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <th scope="row">ET123</th>
                <td>Addis</td>
                <td>Diredawa</td>
                <td>08:00</td>
                <td>10,000</td>
            </tr>
            <tr>
                <th scope="row">ET456</th>
                <td>Addis</td>
                <td>Hawasa</td>
                <td>10:00</td>
                <td>10,000</td>
            </tr>
            <tr>
                <th scope="row">ET789</th>
                <td>Addis</td>
                <td>Asosa</td>
                <td>05:00</td>
                <td>10,000</td>
            </tr>
            <tr>
                <th scope="row">ET321</th>
                <td>Addis</td>
                <td>Mekele</td>
                <td>02:00</td>
                <td>10,000</td>
            </tr>
            <tr>
                <th scope="row">ET654</th>
                <td>Addis</td>
                <td>Jigjiga</td>
                <td>15:00</td>
                <td>10,000</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
