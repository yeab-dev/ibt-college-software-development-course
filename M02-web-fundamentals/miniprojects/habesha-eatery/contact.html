<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Habesha Eatery</title>

    <meta
        name="description"
        content="Contact Habesha Eatery in Bole, Addis Ababa."
    >
</head>

<body>

    <nav aria-label="Main navigation">
        <a href="index.html">Reservations</a>
        <a href="contact.html" aria-current="page">Contact</a>
    </nav>

    <main>
        <h1>Contact Habesha Eatery</h1>

        <section>
            <h2>Send us a message</h2>

            <form action="#" method="post">

                <div>
                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >
                </div>

                <div>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                    >
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </div>

                <button type="submit">Send message</button>

            </form>
        </section>

        <section>
            <h2>Visit us</h2>

            <address>
                Bole, Addis Ababa
            </address>
        </section>

        <section>
            <h2>Opening hours</h2>

            <table>
                <caption>Habesha Eatery opening hours</caption>

                <thead>
                    <tr>
                        <th scope="col">Day</th>
                        <th scope="col">Hours</th>
                    </tr>
                </thead>

                <tbody>
                    <tr>
                        <th scope="row">Monday</th>
                        <td>10:00–22:00</td>
                    </tr>
                    <tr>
                        <th scope="row">Tuesday</th>
                        <td>10:00–22:00</td>
                    </tr>
                    <tr>
                        <th scope="row">Wednesday</th>
                        <td>10:00–22:00</td>
                    </tr>
                    <tr>
                        <th scope="row">Thursday</th>
                        <td>10:00–22:00</td>
                    </tr>
                    <tr>
                        <th scope="row">Friday</th>
                        <td>10:00–23:00</td>
                    </tr>
                    <tr>
                        <th scope="row">Saturday</th>
                        <td>10:00–23:00</td>
                    </tr>
                    <tr>
                        <th scope="row">Sunday</th>
                        <td>10:00–22:00</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

</body>
</html>
